name: Daily market update

on:
  schedule:
    - cron: "30 2 * * 1-5"    # 08:00 IST, Mon-Fri: overnight US close, Fed, crude, gold, dollar before the open
    - cron: "0 14 * * 1-5"    # 19:30 IST, Mon-Fri: after NSE publishes the day's files
    - cron: "30 16 * * 1-5"   # 22:00 IST retry, picks up anything published late
  workflow_dispatch:          # "Run workflow" button for a manual update

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect data and build the dashboard
        run: python daily_build.py
      - name: Save the collected history back to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Daily data $(TZ=Asia/Kolkata date +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
